<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Mpinda Evata</title>
    <link rel="stylesheet" href="login-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <!-- Background animado -->
        <div class="background-animation">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="floating-shape shape-4"></div>
        </div>

        <!-- Formulário de Login -->
        <div class="login-card">
            <!-- Logo e Título -->
            <div class="login-header">
                <div class="logo">
                    <img src="assets/logo.png" alt="Logo Mpinda Evata" class="brand-logo" onerror="this.onerror=null;this.src=this.dataset.fallback;" data-fallback='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="8" ry="8" fill="%2316213e"/><path d="M8 30l10-12 7 7 10-14" stroke="%234ecdc4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35" cy="13" r="3" fill="%2310b981"/></svg>' />
                    <div class="logo-text">
                        <h1>Mpinda Evata</h1>
                        <p>Dashboard Empresarial</p>
                    </div>
                </div>
            </div>

            <!-- Formulário -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="seu.email@empresa.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>
                    <div class="password-input">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Digite sua senha"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        Lembrar-me
                    </label>
                    <a href="#" class="forgot-password" onclick="showForgotPassword()">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar no Dashboard
                </button>
            </form>

            <!-- Links adicionais -->
            <div class="login-footer">
                <p>Não tem uma conta? <a href="#" onclick="showRegister()">Solicitar acesso</a></p>
                <div class="version-info">
                    <span>Versão 1.0.0</span>
                    <span>•</span>
                    <span id="currentYear">2024</span>
                </div>
            </div>
        </div>

        <!-- Modal de Esqueci a Senha -->
        <div class="modal-overlay" id="forgotPasswordModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Recuperar Senha</h3>
                    <button class="modal-close" onclick="closeForgotPassword()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Digite seu email para receber as instruções de recuperação:</p>
                    <form id="forgotForm">
                        <div class="form-group">
                            <label for="forgotEmail">Email</label>
                            <input type="email" id="forgotEmail" placeholder="seu.email@empresa.com" required>
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-paper-plane"></i>
                            Enviar Instruções
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Notificações -->
        <div class="notification-container" id="notifications"></div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>

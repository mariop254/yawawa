{% extends "base.html" %}

{% block title %}Faturas - Sistema de Faturamento{% endblock %}

{% block content %}
<div class="grid">
    <div class="card">
        <h2>📋 Criar Nova Fatura</h2>
        <form onsubmit="faturaManager.criarFatura(event)">
            <div class="form-group">
                <label for="clienteSelect">Cliente</label>
                <select id="clienteSelect" name="cliente" required>
                    <option value="">Selecione um cliente...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="desconto">Desconto</label>
                <input type="number" id="desconto" name="desconto" step="0.01" min="0" value="0">
            </div>
            <div id="itensContainer" class="form-group">
                <label>Itens da Fatura</label>
                <button type="button" class="btn btn-secondary" onclick="faturaManager.adicionarItem()">+ Adicionar Item</button>
            </div>
            <button type="submit" class="btn btn-primary">Criar Fatura</button>
        </form>
    </div>
</div>

<div class="card">
    <h2>📄 Lista de Faturas</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Valor Total</th>
                <th>Status</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="faturasTable">
            <tr>
                <td colspan="6" style="text-align: center; color: #999;">Carregando...</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Produtos - Sistema de Faturamento{% endblock %}

{% block content %}
<div class="grid">
    <div class="card">
        <h2>➕ Criar Novo Produto</h2>
        <form onsubmit="produtoManager.criarProduto(event)">
            <div class="form-group">
                <label for="produtoNome">Nome do Produto</label>
                <input type="text" id="produtoNome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="produtoPreco">Preço Unitário</label>
                <input type="number" id="produtoPreco" name="preco" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="produtoDescricao">Descrição</label>
                <textarea id="produtoDescricao" name="descricao" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Criar Produto</button>
        </form>
    </div>
</div>

<div class="card">
    <h2>📦 Lista de Produtos</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="produtosTable">
            <tr>
                <td colspan="5" style="text-align: center; color: #999;">Carregando...</td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
